[package]
name = "ledgeling"
version = "0.1.0"
description = "A little company for your desktop"
authors = ["Ledgeling contributors"]
edition = "2021"

[lib]
name = "ledgeling"
path = "src/lib.rs"

[[bin]]
name = "ledgeling"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
chrono = "0.4"
pdf-extract = "0.9"
rfd = "0.15"
scraper = "0.24"
libc = "0.2"
open = "5"
# Terminals are a normal feature: terminal mode and coding mode share them.
portable-pty = "0.9"
# Coding mode, only in builds made with `--features coding`
notify = { version = "8", default-features = false, features = ["macos_fsevent"], optional = true }
ignore = { version = "0.4", optional = true }

[features]
# Experimental coding mode stays out of release builds until it has been run on
# every platform; see docs/coding-mode.md.
coding = ["dep:notify", "dep:ignore"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver", "res"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# Client code for the COSMIC protocols vendored in protocols/.
wayland-scanner = "0.31"
dbus = "0.9"
# The overlay as a Wayland layer surface. The versions follow Tauri's own GTK.
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver", "res"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
dbus = "0.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
