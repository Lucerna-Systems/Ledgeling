[package]
name = "ledgeling"
version = "0.1.0"
description = "A little company for your desktop"
authors = ["Ledgeling contributors"]
edition = "2021"

[lib]
name = "ledgeling"
path = "src/lib.rs"

[[bin]]
name = "ledgeling"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
chrono = "0.4"
pdf-extract = "0.9"
rfd = "0.15"
scraper = "0.24"
libc = "0.2"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver", "res"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
dbus = "0.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
