name: Release

# main -> pre-alpha: every push replaces one rolling prerelease.
# prod -> alpha:     every push publishes a permanent, numbered prerelease
#                    (v<tauri.conf.json version>-alpha.<n>).
on:
  push:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: write
  # Read-only: lets `plan` see whether verify already passed on this commit.
  checks: read

defaults:
  run:
    shell: bash

concurrency:
  # A newer main push supersedes an in-flight pre-alpha; alphas always finish.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'main' }}

jobs:
  plan:
    # Creating the prod branch is not a release.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json)
          case "$GITHUB_REF_NAME" in
            prod)
              last=$(git ls-remote --tags origin "refs/tags/v$base-alpha.*" \
                | sed 's/.*-alpha\.//' | sort -n | tail -1)
              version="$base-alpha.$(( ${last:-0} + 1 ))"
              echo "channel=alpha" >> "$GITHUB_OUTPUT"
              echo "tag=v$version" >> "$GITHUB_OUTPUT"
              ;;
            main)
              version="$base-prealpha.$GITHUB_RUN_NUMBER"
              echo "channel=pre-alpha" >> "$GITHUB_OUTPUT"
              echo "tag=pre-alpha" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Releases are cut from main (pre-alpha) or prod (alpha), not $GITHUB_REF_NAME."
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Planned $version"
      # An alpha promotes a commit that already went through the release on
      # main, so repeating the whole matrix proves nothing new. Skip it only
      # when verify has passed on all three platforms for this exact commit;
      # anything else (a hotfix pushed straight to prod, a failed or missing
      # run) still runs it. Pushes to main always verify: the PR that merged
      # may have been tested against an older main.
      - id: verified
        if: ${{ github.ref_name == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name | test("verify \\((macos|ubuntu|windows)-latest\\)"))] as $v | if ([$v[] | select(.conclusion != "success")] | length) > 0 then 0 else [$v[].name | capture("verify \\((?<os>macos|ubuntu|windows)-latest\\)").os] | unique | length end' \
            || echo 0)
          if [ "$passed" = 3 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "Verify already passed on macOS, Ubuntu and Windows for $GITHUB_SHA; skipping it."
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "Verify has not passed on all platforms for $GITHUB_SHA ($passed of 3); running it."
          fi

  verify:
    needs: plan
    if: ${{ needs.plan.outputs.verified != 'true' }}
    uses: ./.github/workflows/verify.yml

  build:
    needs: [plan, verify]
    # `verify` is skipped for an already-verified alpha; a skipped need would
    # otherwise skip this job too. A failed or cancelled verify still stops it.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    # The GitHub Environment named for the channel ("pre-alpha" or "alpha")
    # holds that build's server addresses; see docs/development.md.
    environment: ${{ needs.plan.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            node-arch: arm64
          # Built on the Apple Silicon runner: the x64 Node install is what the
          # sidecar copies and what makes npm pick the darwin-x64 agent binary.
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            node-arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            node-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.node-arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      # Tauri merges TAURI_CONFIG over tauri.conf.json at compile time, so both
      # cargo and the bundler pick up the Windows installer, icon and node.exe.
      - name: Windows bundle config
        if: runner.os == 'Windows'
        run: |
          echo 'TAURI_CONFIG={"bundle":{"targets":["nsis"],"icon":["icons/icon.png","icons/icon.ico"],"resources":{"../sidecar/node":null,"../sidecar/node.exe":"sidecar/node.exe"}}}' >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: sidecar
      - name: Build app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          # Baked into the binary: the only servers online features may reach.
          # Unset means the feature is unavailable in this build.
          LEDGELING_MARKETPLACE_HOSTS: ${{ vars.LEDGELING_MARKETPLACE_HOSTS }}
          LEDGELING_ANALYTICS_HOSTS: ${{ vars.LEDGELING_ANALYTICS_HOSTS }}
        run: |
          # --config replaces TAURI_CONFIG for the build, so fold it in.
          base="${TAURI_CONFIG:-}"; [ -n "$base" ] || base='{}'
          # Passed as a file: on Windows npx is a .cmd shim, and cmd.exe mangles
          # inline JSON (it cut the argument at the first newline).
          override="$RUNNER_TEMP/tauri-override.json"
          jq -n --argjson base "$base" --arg v "$VERSION" --arg b "$GITHUB_RUN_NUMBER" \
            '$base * {version: $v, bundle: {macOS: {bundleVersion: $b}}}' > "$override"
          npx tauri build --target ${{ matrix.target }} --config "$override"
      - name: Collect artifacts
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          name="Ledgeling_${VERSION}_${{ matrix.label }}"
          mkdir out
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$bundle"/nsis/*-setup.exe "out/$name-setup.exe"
          else
            cp "$bundle"/dmg/*.dmg "out/$name.dmg"
            tar -czf "out/$name.app.tar.gz" -C "$bundle/macos" Ledgeling.app
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ledgeling-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: (cd out && shasum -a 256 * > SHA256SUMS.txt)
      - name: Write notes
        run: |
          {
            if [ "$CHANNEL" = pre-alpha ]; then
              echo "**Pre-alpha build $VERSION** from \`${GITHUB_SHA::7}\` on main. Replaced on every push; expect breakage."
            else
              echo "**Alpha $VERSION**, promoted from main to prod after pre-alpha testing. Not yet for daily use."
            fi
            echo
            echo "Nothing is signed yet."
            echo
            echo "- **macOS:** \`macos-aarch64\` for Apple Silicon, \`macos-x86_64\` for Intel. Gatekeeper refuses the"
            echo "  unnotarized app until you right-click → Open, or run \`xattr -dr com.apple.quarantine /Applications/Ledgeling.app\`."
            echo "- **Windows:** \`windows-x86_64-setup.exe\`. SmartScreen warns about the unknown publisher: More info → Run anyway."
            echo "  The Windows build has not been tested on real hardware."
          } > notes.md
      - name: Publish pre-alpha
        if: env.CHANNEL == 'pre-alpha'
        run: |
          # One rolling release: drop the old one and move its tag to this commit.
          gh release delete pre-alpha --cleanup-tag --yes || true
          gh release create pre-alpha out/* --prerelease --target "$GITHUB_SHA" \
            --title "Pre-alpha $VERSION" --notes-file notes.md
      - name: Publish alpha
        if: env.CHANNEL == 'alpha'
        run: |
          gh release create "$TAG" out/* --prerelease --target "$GITHUB_SHA" \
            --title "Alpha $VERSION" --notes-file notes.md --generate-notes

  # Off until the repo variable ITCH_ENABLED is "true". Only alphas go to itch;
  # pre-alphas stay on GitHub. Setup is in docs/development.md.
  itch:
    needs: [plan, publish]
    if: vars.ITCH_ENABLED == 'true' && needs.plan.outputs.channel == 'alpha'
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # butler comes straight from itch.io's own download server rather than a
      # third-party action, so the API key is only ever handed to itch's tool.
      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          echo "$PWD/butler" >> "$GITHUB_PATH"
          ./butler/butler -V
      - name: Stage channels
        run: |
          # itch installs and updates the app itself, so macOS gets the .app
          # rather than the DMG, and Windows gets the installer.
          for arch in aarch64 x86_64; do
            mkdir -p "itch/macos-$arch"
            tar -xzf "out/Ledgeling_${VERSION}_macos-$arch.app.tar.gz" -C "itch/macos-$arch"
          done
          mkdir -p itch/windows-x86_64
          cp "out/Ledgeling_${VERSION}_windows-x86_64-setup.exe" itch/windows-x86_64/
      - name: Push to itch.io
        run: |
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::Secret BUTLER_API_KEY is not set."; exit 1; }
          [ -n "$ITCH_TARGET" ] || { echo "::error::Variable ITCH_TARGET (user/game) is not set."; exit 1; }
          for channel in macos-aarch64 macos-x86_64 windows-x86_64; do
            butler push "itch/$channel" "$ITCH_TARGET:$channel" --userversion "$VERSION"
          done
